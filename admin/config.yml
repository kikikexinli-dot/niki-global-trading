backend:
  name: git-gateway
  branch: main
media_folder: "uploads"
public_folder: "/uploads"
collections:
  - name: about_products
    label: "About 产品列表"
    folder: "content/about-products"
    create: true
    delete: true
    slug: "{{title}}"
    fields:
      - {label: "产品图片", name: "image", widget: "image", required: true}
      - {label: "产品名称", name: "title", widget: "string", required: true}
      - {label: "产品简介", name: "desc", widget: "text", required: true}
